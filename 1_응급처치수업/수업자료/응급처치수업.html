const cases=[
{"id":"wound","emoji":"🩹","name":"운동장 찰과상","scene":"달리기를 하던 친구가 넘어졌습니다. 무릎에 흙이 묻은 작은 찰과상이 생겼고 피가 조금 배어 나와요. 심한 출혈은 없어요.","clue":"이 미션은 작은 찰과상 상황이에요. 처음부터 피가 많이 나거나 어지러우면 세척보다 압박 지혈과 도움 요청이 우선이에요.","items":["water"],"steps":["어른에게 알리고 손을 깨끗이 한다.","흙이 묻은 작은 상처를 깨끗한 물로 씻는다.","세척 후에도 출혈이 있으면 깨끗한 거즈나 밴드로 5분 이상 계속 눌러 지혈한다.","피가 멈추면 거즈나 밴드로 상처 부위를 충분히 덮어 보호한다."],"why":{"q":"흙이 묻은 찰과상을 깨끗한 물로 씻는 가장 중요한 이유는?","opts":["상처를 일부러 따갑게 하기 위해","상처의 오염물질을 제거해 감염 위험을 줄이기 위해","피가 더 많이 나오게 하기 위해"],"answer":1,"ex":"흐르는 깨끗한 물로 씻으면 흙과 오염물질을 제거해 감염 위험을 낮추는 데 도움이 됩니다."},"twist":{"text":"상처에서 피가 계속 많이 나고 아이가 어지럽다고 합니다. 이제 어떻게 해야 할까요?","opts":["혼자 교실로 돌려보낸다.","즉시 어른과 119에 도움을 요청하고 깨끗한 거즈로 직접 압박한다.","상처에 흙을 덮는다."],"answer":1,"ex":"이제는 심한 출혈 상황이므로 세척을 계속하지 않아요. 즉시 어른과 119에 도움을 요청하고 깨끗한 거즈 등으로 직접 압박하며 도움을 기다려요."},"alternatives":[["gauze","bandage"]]},
{id:'nose',emoji:'👃',name:'갑자기 코피',scene:'교실에서 친구가 갑자기 코피를 흘립니다. 친구는 고개를 뒤로 젖히려고 해요.',clue:'머리를 뒤로 젖히지 않아요. 심한 출혈이나 머리 부상 후 출혈은 즉시 도움을 받아야 해요.',items:['tissue','gloves'],steps:['어른에게 알리고 친구를 앉혀 몸과 머리를 조금 앞으로 기울이게 한다.','콧방울의 말랑한 부분을 엄지와 검지로 누른다.','중간에 떼어 확인하지 않고 10~15분 동안 지속해서 누른다.','출혈이 멈추지 않거나 심하면 어른의 도움을 받아 진료받는다.'],why:{q:'코피가 날 때 고개를 앞으로 기울이는 이유는?',opts:['피가 목 뒤로 넘어가는 것을 줄이기 위해','코를 더 아프게 하기 위해','코피가 눈으로 나오게 하기 위해'],answer:0,ex:'머리를 뒤로 젖히면 피가 목으로 넘어갈 수 있어요. 앞으로 약간 숙이고 콧방울을 압박합니다.'},twist:{text:'15분 이상 제대로 눌렀는데도 피가 계속 많이 흐릅니다. 무엇을 할까요?',opts:['코를 세게 풀게 한다.','어른에게 즉시 알리고 의료적 도움을 받는다.','뒤로 눕혀 재운다.'],answer:1,ex:'지속되거나 많은 코피는 의료진의 평가가 필요합니다.'}},
{"id":"burn","emoji":"🔥","name":"뜨거운 물 화상","scene":"급식실 근처에서 친구의 손등에 뜨거운 물이 조금 튀었습니다. 작은 부위가 빨갛고 아프지만 피부가 벗겨지거나 물집이 생기지는 않았어요.","clue":"이 미션은 작은 화상에 대한 교과서 학습이에요. 넓거나 깊은 화상, 호흡 곤란은 즉시 어른과 119에 도움을 요청해요.","items":["water","cream","gauze"],"forbidden":["bandage","antiseptic"],"steps":["안전을 확인하고 어른에게 즉시 알린다.","흐르는 찬물로 화상 부위를 10분 이상 충분히 식힌다. 얼음은 직접 대지 않는다.","열기가 완전히 식은 뒤 어른이 확인한 화상용 연고를 바른다.","물집이 생기면 터뜨리지 않고 깨끗한 비점착성 거즈로 덮어 보호하며 어른과 진료받는다."],"why":{"q":"화상 부위에 흐르는 시원한 물을 사용하는 주된 이유는?","opts":["피부에 남아 있는 열을 식혀 손상을 줄이기 위해","화상 부위를 얼리기 위해","물집을 터뜨리기 위해"],"answer":0,"ex":"냉각을 먼저 하고, 열기가 완전히 식은 뒤 어른이 확인한 화상용 연고를 사용해요. 얼음을 직접 대지 않아요."},"twist":{"text":"화상 부위를 식힌 뒤 물집이 생겼어요. 친구가 물집을 터뜨리자고 합니다. 어떻게 할까요?","opts":["물집을 바늘로 터뜨린다.","물집을 터뜨리지 않고 깨끗한 비점착성 거즈로 덮어 보호한 뒤 어른과 진료받는다.","접착면이 물집에 닿도록 일반 밴드를 꼭 붙인다."],"answer":1,"ex":"물집이 있는 화상은 임의로 연고를 바르거나 물집을 건드리지 말고 어른과 의료진의 도움을 받아요."}},
{id:'ankle',emoji:'🦶',name:'발목을 접질렀어요',scene:'축구를 하던 친구가 발목을 삐끗했습니다. 붓고 통증이 있어 제대로 걷기 어려워요.',clue:'다친 발을 억지로 걷게 하거나 꺾지 않아요. 이미 걷기 어려운 상황이므로 어른의 도움을 받아 진료받아요.',items:['cold'],steps:['활동을 중단하고 억지로 이동시키지 않은 채 안전하게 쉬도록 돕는다.','어른에게 알리고 통증과 부기를 확인한다. 걸어 보라고 시키지 않는다.','보호 덮개로 감싼 냉찜질 팩을 한 번에 20분 이내로 대며 피부 상태를 살핀다.','다친 발에 체중을 싣지 않게 하고 어른의 도움을 받아 진료받는다.'],why:{q:'냉찜질 팩을 보호 덮개로 감싸서 사용하는 이유는?',opts:['피부가 과하게 차가워져 손상되는 것을 막기 위해','얼음을 더 뜨겁게 만들기 위해','발목을 더 세게 누르기 위해'],answer:0,ex:'차가운 팩을 피부에 직접 오래 대면 냉손상이 생길 수 있어요. 보호 덮개로 감싸서 사용합니다.'},twist:{text:'친구가 발에 체중을 거의 실을 수 없고 발목 모양도 이상해 보입니다. 어떻게 할까요?',opts:['걸어 보라고 계속 시킨다.','움직임을 최소화하고 어른과 의료진의 도움을 받는다.','세게 주무른다.'],answer:1,ex:'골절 등 심한 손상 가능성이 있어 함부로 걷거나 조작하지 않도록 해요.'}},
{id:'eye',emoji:'👁️',name:'눈에 먼지가!',scene:'운동장 바람 때문에 친구의 눈에 먼지가 들어갔습니다. 따갑다며 눈을 비비려고 해요.',clue:'눈에 박힌 물체, 화학물질, 심한 통증이나 시력 변화는 일반 먼지와 다르게 대처해야 해요.',items:['water'],forbidden:['cream','antiseptic'],steps:['눈을 비비지 말고 어른에게 알린다.','손을 깨끗이 하고, 박힌 물체가 의심되면 건드리지 않고 즉시 진료받는다.','깨끗한 물로 부드럽게 씻어낸다.','통증이나 이물감이 지속되면 의료진의 도움을 받는다.'],why:{q:'눈에 먼지가 들어갔을 때 비비지 않아야 하는 이유는?',opts:['먼지가 눈을 긁어 손상을 줄 수 있기 때문에','눈이 너무 깨끗해지기 때문에','눈물이 마르기 때문에'],answer:0,ex:'먼지가 있는 상태에서 비비면 각막 표면에 상처를 낼 수 있어요.'},twist:{text:'씻어도 눈을 뜨기 힘들고 시야가 흐려졌다고 합니다. 어떻게 해야 할까요?',opts:['계속 눈을 세게 문지른다.','즉시 어른에게 알리고 의료진에게 진료받는다.','일단 혼자 자게 한다.'],answer:1,ex:'시력 변화나 심한 통증은 신속한 진료가 필요한 위험 신호예요.'}},
{id:'bee',emoji:'🐝',name:'벌에 쏘였어요',scene:'현장체험학습 중 친구의 팔에 벌이 앉았다가 쏘았습니다. 팔이 아프고 빨갛게 부어올라요.',clue:'호흡 곤란·목이나 혀의 부종·심한 어지럼은 위험 신호예요. 이런 증상이 있으면 즉시 어른과 119에 도움을 요청해요.',items:['card','water','soap','cold'],steps:['벌이 있는 곳에서 벗어나 어른에게 알리고 호흡 곤란 등 전신 증상을 확인한다.','남은 벌침이 보이면 가능한 한 빨리 조심스럽게 제거한다.','비누와 물로 씻고 보호 덮개로 감싼 냉찜질 팩을 한 번에 20분 이내로 댄다.','처치하는 동안과 이후에도 전신 증상을 살피고, 숨이 차면 즉시 119에 신고한다.'],why:{q:'벌에 쏘인 뒤 남아 있는 벌침을 빨리 제거하는 이유는?',opts:['독이 더 들어갈 가능성을 줄이기 위해','벌을 다시 부르기 위해','피부를 더 깊게 찌르기 위해'],answer:0,ex:'남은 벌침은 신속하게 제거하는 것이 중요해요. 카드 가장자리 등으로 밀어 제거할 수 있으며, 제거 방식보다 신속성이 중요합니다.'},twist:{text:'갑자기 친구가 숨이 차고 목이 조이는 듯하다고 합니다. 무엇을 할까요?',opts:['가만히 기다린다.','즉시 119 신고와 어른의 도움을 요청하고, 처방된 에피네프린 자동주사기가 있다면 교육받은 사람이 사용하도록 돕는다.','물을 억지로 먹인다.'],answer:1,ex:'심한 알레르기 반응은 생명을 위협할 수 있어요. 즉시 119에 신고하고 응급 대응이 필요합니다.'}}

const catalog=[{id:'soap',e:'🧼',n:'비누',price:10},{id:'water',e:'💧',n:'깨끗한 물',price:20},{id:'gauze',e:'⬜',n:'멸균 거즈',note:'화상 보호에는 비점착성 제품을 사용해요',price:20},{id:'bandage',e:'🩹',n:'밴드',price:15},{id:'tissue',e:'🧻',n:'휴지',price:10},{id:'gloves',e:'🧤',n:'일회용 장갑',price:15},{id:'cold',e:'🧊',n:'냉찜질 팩',note:'보호 덮개 포함 · 피부에 직접 대지 않아요',price:25},{id:'card',e:'💳',n:'납작한 카드',price:10},{id:'cream',e:'🧴',n:'연고',note:'화상 미션은 충분히 식힌 뒤 어른이 확인한 화상용 제품을 사용해요',price:30},{id:'antiseptic',e:'🧴',n:'소독약',price:20,note:'어른이 용도 확인 · 눈·화상에 사용 금지'},{id:'ice',e:'❄️',n:'얼음 직접 대기',price:5},{id:'soda',e:'🥤',n:'탄산음료',price:10}];
let completed=[];
try{const saved=JSON.parse(localStorage.getItem('emergencyGameCompleted'));if(Array.isArray(saved))completed=[...new Set(saved.filter(id=>cases.some(c=>c.id===id)))];}catch{}
function markCompleted(id){if(completed.includes(id))return;completed.push(id);try{localStorage.setItem('emergencyGameCompleted',JSON.stringify(completed))}catch{}}
let state={case:-1,stage:0,bought:[],order:[],answer:null,feedback:'',team:''};const el=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{sessionStorage.setItem('emergencyGame',JSON.stringify(state))}catch{}}function set(o){state={...state,...o};save();render()}function restart(){state={case:-1,stage:0,bought:[],order:[],answer:null,feedback:'',team:state.team};save();render()}
function render(){document.getElementById('site-credits').hidden=false;document.getElementById('site-version').hidden=state.case>=0;if(state.case<0)return home();let c=cases[state.case];let phase=state.stage;let title=['📟 상황 확인','🎒 장비 챙기기','🧩 순서 맞추기','💡 이유 찾기','🚨 도전 상황','🏆 미션 성공'][phase];el.innerHTML=`<div class="toolbar"><span class="pill">🚨 ${esc(c.name)}</span><span class="pill">${esc(state.team||'구조대')} 팀</span><span class="pill">${phase+1}/6 · ${title}</span><div class="meter"><div class="bar" style="width:${(phase+1)/6*100}%"></div></div><button class="btn secondary" onclick="restart()">처음으로</button></div>`; if(phase===0)scene(c);if(phase===1)shop(c);if(phase===2)order(c);if(phase===3)quiz(c,'why');if(phase===4)quiz(c,'twist');if(phase===5)finish(c)}
function home(){el.innerHTML=`<section class="card hero home-hero"><div class="hero-mascot" aria-hidden="true">🚑<span>✨</span></div><div class="eyebrow">⭐ 오늘의 히어로 미션</div><h1>출동! 꼬마 구조대<br><span class="hero-subtitle">친구를 도와줄 히어로는 바로 너!</span></h1><p>📟 삐빅! 친구에게 도움이 필요해요.<br>장비를 챙기고 미션을 해결해 우리 반 안전 히어로가 되어 보세요!</p><label class="label" for="team">우리 모둠 이름</label><form class="team-form" onsubmit="confirmTeam(event)"><input id="team" maxlength="24" required value="${esc(state.team)}" placeholder="예: 번개 구조대" aria-describedby="team-help" style="display:block;width:100%;max-width:350px;background:#0e2744;border:1px solid #6d8aaa;border-radius:11px;padding:13px;color:white"><button class="btn" type="submit">확인</button></form><p id="team-help" class="muted">모둠 이름을 입력하고 확인을 누르면 완료 기록이 초기화돼요.</p>${state.feedback==='team-ready'?`<div class="good" role="status">🚑 ${esc(state.team)}, 출동 준비 완료! 새로운 미션을 골라 주세요.</div>`:''}</section><div class="mission-heading"><h2>어떤 친구를 도와줄까요?</h2><span class="mission-count">${completed.length} / 6 미션 완료 ⭐</span></div><div class="grid">${cases.map((c,i)=>`<button class="case" onclick="start(${i})"><span class="emoji">${c.emoji}</span><b>${esc(c.name)}</b>${completed.includes(c.id)?'<span class="completed-badge">✓ 미션 완료</span>':''}<small>${esc(c.scene)}</small></button>`).join('')}</div>`}
function confirmTeam(event){
event.preventDefault();
const input=document.getElementById('team');const team=input.value.trim();
if(!team){input.setCustomValidity('모둠 이름을 입력해 주세요.');input.reportValidity();input.setCustomValidity('');return;}
completed=[];try{localStorage.removeItem('emergencyGameCompleted')}catch{}
set({case:-1,stage:0,bought:[],order:[],answer:null,feedback:'team-ready',team});
}
function shuffledIndices(n){const list=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
function start(i){let team=document.getElementById('team')?.value.trim()||`제${i+1}구조대`;let stepChoices=shuffledIndices(4);if(stepChoices.every((v,n)=>v===n))stepChoices.push(stepChoices.shift());set({case:i,team,stage:0,bought:[],order:[],answer:null,feedback:'',stepChoices,quizChoices:{why:shuffledIndices(3),twist:shuffledIndices(3)}})}
function scene(c){el.innerHTML+=`<section class="card hero"><div class="eyebrow">📟 미션 1 · 구조 요청 도착!</div><h1>${c.emoji} ${esc(c.name)}</h1><p style="font-size:21px;color:white">${esc(c.scene)}</p><figure class="scene-photo"><img src="assets/${c.id}.png" alt="${esc(c.name)} 상황을 재현한 AI 이미지" width="1536" height="1024"><figcaption>AI 재현 이미지 · 실제 사고를 촬영한 사진이 아닙니다.</figcaption></figure><div class="alert">📢 구조본부 안내: ${esc(c.clue)}</div><div class="btnrow"><button class="btn" onclick="set({stage:1})">사건 분석 완료 · 장비 상점으로 →</button></div></section>`}
function shop(c){let total=state.bought.reduce((s,id)=>s+catalog.find(x=>x.id===id).price,0);el.innerHTML+=`<section class="card"><div class="eyebrow">🎒 미션 2 · 구조 가방을 채워라!</div><h2>100코인 안에서 장비를 고르세요!</h2><p>사건에 필요한 장비를 클릭해 장바구니에 넣어 보세요. 꼭 필요한 장비를 빠뜨리지 않았는지 생각하세요.</p><h2>🪙 남은 코인: ${100-total}</h2><div class="shop">${catalog.map(i=>`<button class="item ${state.bought.includes(i.id)?'active':''}" onclick="toggleItem('${i.id}')"><span class="big">${i.e}</span><b>${i.n}</b><small>${i.price} 코인 ${state.bought.includes(i.id)?'✓ 선택됨':''}</small></button>`).join('')}</div>${state.feedback?`<div class="${state.feedback==='ok'?'good':'alert'}">${state.feedback==='ok'?'✅ 필요한 기본 장비를 준비했어요!':esc(shopFeedback(c))}</div>`:''}<div class="btnrow"><button class="btn secondary" onclick="set({stage:0,feedback:''})">← 뒤로</button><button class="btn" onclick="checkShop()">장비 검사하기</button>${state.feedback==='ok'?'<button class="btn" onclick="set({stage:2,feedback:\'\'})">다음 미션 →</button>':''}</div></section>`}
function toggleItem(id){let list=state.bought.includes(id)?state.bought.filter(x=>x!==id):[...state.bought,id];if(list.reduce((s,v)=>s+catalog.find(x=>x.id===v).price,0)>100){state.feedback='budget';save();render();return}set({bought:list,feedback:''})}
function shopIssues(c){
const name=id=>catalog.find(x=>x.id===id).n;
const missing=c.items.filter(id=>!state.bought.includes(id)).map(name);
for(const group of c.alternatives||[])if(!group.some(id=>state.bought.includes(id)))missing.push(group.map(name).join(' 또는 '));
const unsafe=[...new Set(['ice','soda',...(c.forbidden||[])])].filter(id=>state.bought.includes(id)).map(name);
return {missing,unsafe};
}
function shopFeedback(c){
if(state.feedback==='budget')return '⚠️ 100코인을 초과할 수 없어요. 선택한 장비를 눌러 빼고 다시 골라 주세요.';
return '⚠️ 장비 구성을 다시 확인해 주세요. 모둠 친구들과 선택한 이유를 이야기하고 다시 도전해 보세요.';
}
function checkShop(){const {missing,unsafe}=shopIssues(cases[state.case]);set({feedback:!missing.length&&!unsafe.length?'ok':'retry'})}
function order(c){let available=(state.stepChoices||[1,3,0,2]).map(i=>({i,t:c.steps[i]}));let left=available.filter(x=>!state.order.includes(x.i));el.innerHTML+=`<section class="card"><div class="eyebrow">🧩 미션 3 · 순서 퍼즐을 풀어라!</div><h2>무엇부터 하면 좋을까요?</h2><p>이 사건에서 아래 행동을 <b>실시할 순서대로</b> 선택하세요. 실제 상황에서는 도움 요청과 상태 관찰을 처치와 함께 할 수 있어요. 잘못 선택했다면 선택한 행동을 눌러 취소할 수 있어요.</p><div class="label">선택 가능한 행동</div><div>${left.map(x=>`<button class="choice" onclick="addStep(${x.i})">${esc(x.t)}</button>`).join('')||'<p class="muted">모든 행동을 선택했습니다.</p>'}</div><div class="label">내가 만든 응급처치 순서</div><div class="stack">${state.order.map((i,n)=>`<button class="tag selected" onclick="removeStep(${i})">${n+1}. ${esc(c.steps[i])} ✕</button>`).join('')||'<span class="muted">행동을 순서대로 눌러 주세요.</span>'}</div>${state.feedback?`<div class="${state.feedback==='ok'?'good':'alert'}">${state.feedback==='ok'?'✅ 순서가 정확해요!':'⚠️ 아직 순서가 맞지 않아요. 모둠 친구들과 각 행동을 언제 해야 할지 이야기하고 다시 도전해 보세요.'}</div>`:''}<div class="btnrow"><button class="btn secondary" onclick="set({stage:1,feedback:''})">← 뒤로</button><button class="btn" onclick="checkOrder()">순서 확인</button>${state.feedback==='ok'?'<button class="btn" onclick="set({stage:3,feedback:\'\',answer:null})">다음 미션 →</button>':''}</div></section>`}
function addStep(i){set({order:[...state.order,i],feedback:''})}function removeStep(i){set({order:state.order.filter(x=>x!==i),feedback:''})}function checkOrder(){set({feedback:state.order.join(',')==='0,1,2,3'?'ok':'retry'})}
function quiz(c,type){let q=c[type],stage=type==='why'?4:5;el.innerHTML+=`<section class="card"><div class="eyebrow">MISSION 0${stage} · ${type==='why'?'왜 그렇게 해야 할까?':'새로운 긴급 상황!'}</div><h2>${type==='why'?'💡 왜 이렇게 도와야 할까요?':'🚨 현장 상황이 바뀌었습니다!'}</h2><p class="question">${esc(q.q||q.text)}</p>${(state.quizChoices?.[type]||[0,1,2]).map((i,n)=>`<button class="choice ${state.answer===i?'active':''}" onclick="set({answer:${i},feedback:''})"><span class="letter">${'ABC'[n]}</span>${esc(q.opts[i])}</button>`).join('')}${state.feedback?`<div class="${state.feedback==='ok'?'good':'alert'}">${state.feedback==='ok'?'✅ '+esc(q.ex):'⚠️ 다시 생각해 보세요. 무엇이 환자의 안전을 가장 잘 지킬까요?'}</div>`:''}<div class="btnrow"><button class="btn secondary" onclick="set({stage:${stage-2},answer:null,feedback:''})">← 뒤로</button><button class="btn" onclick="set({feedback:state.answer===${q.answer}?'ok':'retry'})" ${state.answer===null?'disabled':''}>정답 확인</button>${state.feedback==='ok'?`<button class="btn" onclick="set({stage:${stage},answer:null,feedback:''})">${stage===5?'임무 완료 →':'긴급 상황 발생 →'}</button>`:''}</div></section>`}
function finish(c){markCompleted(c.id);el.innerHTML+=`<section class="card hero mission-finish" style="text-align:center"><div class="confetti" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="--left:${(i*37)%100}%;--delay:${(i%6)*.12}s;--color:${['#48d5c4','#ffdc78','#8ebcff','#f5a5c8'][i%4]}"></i>`).join('')}</div><div class="trophy">🏆</div><div class="eyebrow">⭐⭐⭐ 미션 클리어!</div><h1>멋지게 해냈어요!</h1><p class="result">${esc(state.team)} · ${esc(c.name)}</p><p>상황 확인부터 장비 준비, 순서 퍼즐과 도전 상황까지!<br>친구를 안전하게 돕는 방법을 끝까지 배웠어요.</p><div class="good">🎖️ 친구를 돕는 안전 히어로 인증!</div><p>마지막으로 실제 상황에서는 혼자 해결하려 하지 말고 즉시 어른에게 알리고 필요할 때 119를 부르세요.</p><div class="btnrow" style="justify-content:center"><button class="btn secondary" onclick="restart()">다른 사건 도전</button></div></section>`}
function validPermutation(list,n){return Array.isArray(list)&&list.length===n&&new Set(list).size===n&&list.every(v=>Number.isInteger(v)&&v>=0&&v<n)}
function validState(x){return (!x?.stepChoices||validPermutation(x.stepChoices,4))&&(!x?.quizChoices||(validPermutation(x.quizChoices.why,3)&&validPermutation(x.quizChoices.twist,3)))&&x&&Number.isInteger(x.case)&&x.case>=-1&&x.case<cases.length&&Number.isInteger(x.stage)&&x.stage>=0&&x.stage<=5&&Array.isArray(x.bought)&&new Set(x.bought).size===x.bought.length&&x.bought.every(id=>catalog.some(i=>i.id===id))&&x.bought.reduce((sum,id)=>sum+catalog.find(i=>i.id===id).price,0)<=100&&Array.isArray(x.order)&&new Set(x.order).size===x.order.length&&x.order.every(i=>Number.isInteger(i)&&i>=0&&i<4)&&(x.answer===null||Number.isInteger(x.answer)&&x.answer>=0&&x.answer<3)&&typeof x.team==='string'&&x.team.length<=24&&['','ok','retry','budget','team-ready'].includes(x.feedback)}
try{const x=JSON.parse(sessionStorage.getItem('emergencyGame'));if(validState(x))state={...x,feedback:''}}catch{}render();
</script></body></html>
